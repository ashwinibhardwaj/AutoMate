<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Background Shapes</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0e0b16; /* Dark background for contrast */
        }
        
        .background-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        /* Hexagon Shape */
        .hexagon {
            position: absolute;
            width: 120px;
            height: 69.28px;
            background-color: #6A0572; /* Deep purple */
            margin: 34.64px 0;
            top: 20%;
            left: 15%;
            transform: rotate(90deg);
        }
        
        .hexagon:before, .hexagon:after {
            content: "";
            position: absolute;
            width: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
        }
        
        .hexagon:before {
            border-bottom: 34.64px solid #6A0572;
            top: -34.64px;
        }
        
        .hexagon:after {
            border-top: 34.64px solid #6A0572;
            bottom: -34.64px;
        }
        
        .hexagon.small {
            width: 80px;
            height: 46.19px;
            top: 65%;
            left: 70%;
            transform: rotate(45deg);
        }
        
        .hexagon.small:before, .hexagon.small:after {
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
        }
        
        .hexagon.small:before {
            border-bottom: 23.09px solid #6A0572;
            top: -23.09px;
        }
        
        .hexagon.small:after {
            border-top: 23.09px solid #6A0572;
            bottom: -23.09px;
        }
        
        /* Large Circle */
        .circle-large {
            position: absolute;
            border-radius: 50%;
            background-color: #FEBE10; /* Bright yellow */
            width: 150px;
            height: 150px;
            top: 50%;
            left: 35%;
            opacity: 0.6;
        }
        
        /* Small Circle */
        .circle-small {
            position: absolute;
            border-radius: 50%;
            background-color: #05A8AA; /* Soft teal */
            width: 60px;
            height: 60px;
            top: 15%;
            left: 80%;
            opacity: 0.8;
        }
        
        /* Connecting Lines */
        .line-horizontal {
            position: absolute;
            width: 300px;
            height: 3px;
            background-color: #D3D3D3; /* Light gray */
            top: 30%;
            left: 10%;
        }
        
        .line-vertical {
            position: absolute;
            width: 3px;
            height: 200px;
            background-color: #D3D3D3;
            top: 65%;
            left: 60%;
        }
        
        /* Responsiveness */
        @media (max-width: 768px) {
            .hexagon.small, .circle-large, .line-horizontal, .line-vertical {
                display: none;
            }
        }
        
        
    </style>
</head>
<body>
    <div class="background-container">
        <div class="hexagon"></div>
        <div class="hexagon small"></div>
        <div class="circle-large"></div>
        <div class="circle-small"></div>
        <div class="line-horizontal"></div>
        <div class="line-vertical"></div>
    </div>
</body>
</html>
